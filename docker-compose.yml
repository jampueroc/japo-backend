# Two independent services on purpose:
#
#   docker compose up -d mariadb   -> only the database (macOS development,
#                                     the API then runs natively with
#                                     `make dev` and DB_HOST=localhost)
#   docker compose up -d           -> database + API (Raspberry Pi deploy)

services:
  mariadb:
    image: mariadb:11.4
    container_name: japo-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root}
      MARIADB_DATABASE: ${DB_NAME:-japo}
      MARIADB_USER: ${DB_USER:-japo}
      MARIADB_PASSWORD: ${DB_PASSWORD:-japo}
    ports:
      # Published so the natively running API (macOS dev) can reach it.
      # Bound to loopback by default: on the Pi the database must never be
      # reachable from the LAN. Override with DB_BIND=0.0.0.0 if you really
      # need it exposed.
      - "${DB_BIND:-127.0.0.1}:${DB_PORT:-3306}:3306"
    networks:
      - japo
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./my.cnf:/etc/mysql/conf.d/99-japo.cnf:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    # Hard cap so MariaDB can never starve the Pi.
    deploy:
      resources:
        limits:
          memory: 512M

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TARGETARCH: ${TARGETARCH:-arm64}
        VERSION: ${VERSION:-dev}
    image: ${API_IMAGE:-japo-api}:${API_TAG:-latest}
    container_name: japo-api
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-production}
      HTTP_PORT: 8080
      # Inside the compose network the database is reachable by service name.
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-japo}
      DB_USER: ${DB_USER:-japo}
      DB_PASSWORD: ${DB_PASSWORD:-japo}
      DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-10}
      DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:-5}
      DB_AUTO_MIGRATE: ${DB_AUTO_MIGRATE:-true}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set, see .env.example}
      JWT_TTL: ${JWT_TTL:-1h}
      BCRYPT_COST: ${BCRYPT_COST:-10}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-*}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      # Detrás del nginx del frontend toda petición llega desde la red `japo`.
      # Sin esto el limitador por IP degenera en un único limitador global.
      HTTP_TRUSTED_PROXIES: ${HTTP_TRUSTED_PROXIES:-}
      # --- Correo ---------------------------------------------------------
      # Con MAIL_DRIVER=log el código de verificación se escribe en el log en
      # vez de enviarse: cómodo en desarrollo, inservible en producción.
      MAIL_DRIVER: ${MAIL_DRIVER:-log}
      MAIL_FROM: ${MAIL_FROM:-japo-api@localhost}
      MAIL_TIMEOUT: ${MAIL_TIMEOUT:-10s}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_TLS: ${SMTP_TLS:-starttls}
      # El enlace de "he olvidado mi contraseña" se construye con estas dos. Si
      # APP_PUBLIC_URL no apunta a donde el usuario abre la app de verdad, el
      # correo sale con un enlace que no lleva a ninguna parte.
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:4400}
      APP_RESET_PATH: ${APP_RESET_PATH:-/reset-password}
      # --- Verificación de email -------------------------------------------
      # Ojo: con APP_ENV=production, poner esto a true mientras MAIL_DRIVER siga
      # en log hace que el API se niegue a arrancar (validación de config), y con
      # razón: sería una puerta que nadie puede cruzar.
      AUTH_REQUIRE_VERIFIED_EMAIL: ${AUTH_REQUIRE_VERIFIED_EMAIL:-false}
      AUTH_VERIFICATION_CODE_TTL: ${AUTH_VERIFICATION_CODE_TTL:-15m}
      AUTH_MAX_VERIFICATION_ATTEMPTS: ${AUTH_MAX_VERIFICATION_ATTEMPTS:-5}
      AUTH_RESET_TOKEN_TTL: ${AUTH_RESET_TOKEN_TTL:-1h}
    ports:
      # Loopback por defecto: el frontend llega al API por la red `japo`, no por
      # el puerto publicado. Éste queda para depurar desde la propia máquina.
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8080}:8080"
    networks:
      - japo
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  mariadb_data:
    # Default: a named volume managed by Docker (fine on macOS).
    #
    # On the Raspberry Pi, put the data on the external SSD instead by
    # uncommenting the block below and pointing `device` at a directory that
    # already exists on the mounted disk:
    #
    # driver: local
    # driver_opts:
    #   type: none
    #   o: bind
    #   device: /mnt/ssd/japo/mariadb

# Red compartida con el frontend (japo-app), que la declara como `external`.
# La subnet es explícita a propósito: en una máquina con muchos stacks el pool
# por defecto de Docker (172.17-172.31) se agota, y entonces Docker pasa a
# repartir desde 192.168.0.0/16, que puede solaparse con la LAN. Fijarla evita
# esa lotería y hace que HTTP_TRUSTED_PROXIES sea predecible.
networks:
  japo:
    name: ${JAPO_NETWORK:-japo_net}
    ipam:
      config:
        - subnet: ${JAPO_SUBNET:-172.16.10.0/24}
